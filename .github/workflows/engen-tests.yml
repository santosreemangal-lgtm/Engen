name: Engen Safety and Unit Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Engen-main/Engen-main
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile Python sources
        run: python -m compileall -q main.py engine dashboard && python -m py_compile ../../main.py

      - name: Run unit tests
        run: python -m unittest discover -s engine/engine/engine/tests -v

      - name: Run read-only health check
        run: python main.py

      - name: Test repository-root entry point
        working-directory: .
        run: python main.py
