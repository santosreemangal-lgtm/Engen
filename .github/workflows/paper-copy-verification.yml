name: Paper Copy Pipeline Verification

on:
  push:
    branches:
      - feature/paper-trading-dashboard-integration
  pull_request:
    branches:
      - main
      - feature/phase-9-dashboard-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile project
        run: python -m compileall -q Engen-main/Engen-main

      - name: Run offline unit tests
        working-directory: Engen-main/Engen-main
        run: python -m unittest discover -s engine/engine/engine/tests -v

      - name: Run mock analysis check
        run: python main.py --mock-analysis-test
