name: Paper simulation regression

on:
  push:
    branches:
      - feat/websocket-paper-latency-pipeline
  pull_request:
    branches:
      - feat/websocket-paper-latency-pipeline
      - feature/paper-balance-dashboard-refresh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-simulation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate dashboard inline JavaScript syntax
        working-directory: Engen-main/Engen-main
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("dashboard/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.DOTALL | re.IGNORECASE)
          if not scripts:
              raise SystemExit("No inline dashboard script found")
          Path("/tmp/dashboard-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/dashboard-inline.js

      - name: Run the complete offline unit suite ten times
        working-directory: Engen-main/Engen-main
        shell: bash
        run: |
          set -euo pipefail
          for run_number in {1..10}; do
            echo "=== Full offline unit suite run ${run_number}/10 ==="
            python -m unittest discover -s engine/engine/engine/tests -v
          done

      - name: Run focused market-data and proportional-sell regressions ten times
        working-directory: Engen-main/Engen-main
        shell: bash
        run: |
          set -euo pipefail
          for run_number in {1..10}; do
            echo "=== Focused regression run ${run_number}/10 ==="
            python -m unittest \
              engine.engine.engine.tests.test_market_data \
              engine.engine.engine.tests.test_paper_sell_ratio_regression -v
          done
