name: Phase 9 Dashboard and Engine Checks

on:
  pull_request:
    branches: ["feature/phase-7-profile-storage"]
  push:
    branches: ["feature/phase-7-profile-storage"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: Engen-main/Engen-main/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f Engen-main/Engen-main/requirements.txt ]; then
            python -m pip install -r Engen-main/Engen-main/requirements.txt
          fi

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r Engen-main/Engen-main/requirements.txt

      - name: Compile project
        run: python -m compileall -q Engen-main/Engen-main

      - name: Run offline unit tests
        working-directory: Engen-main/Engen-main
        run: python -m unittest discover -s engine/engine/engine/tests -v

      - name: Run mock analysis check
        run: python main.py --mock-analysis-test
