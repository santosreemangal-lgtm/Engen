name: Python offline tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/**']

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline unit tests
        working-directory: Engen-main/Engen-main
        run: python -m unittest discover -s engine/engine/engine/tests -v
      - name: Run mock analysis smoke test
        working-directory: Engen-main/Engen-main
        run: python main.py --mock-analysis-test
