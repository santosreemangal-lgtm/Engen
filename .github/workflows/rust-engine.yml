name: Rust Engine Checks

on:
  pull_request:
    paths:
      - "Engen-main/Engen-main/rust-engine/**"
      - ".github/workflows/rust-engine.yml"
  push:
    branches:
      - "rewrite/rust-backend-20261109"
    paths:
      - "Engen-main/Engen-main/rust-engine/**"
      - ".github/workflows/rust-engine.yml"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Engen-main/Engen-main/rust-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Unit tests
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
