name: Rust Engine Checks

on:
  pull_request:
    paths:
      - "Engen-main/Engen-main/rust-engine/**"
      - ".github/workflows/rust-engine.yml"
  push:
    branches:
      - "rewrite/rust-backend-20261109"
    paths:
      - "Engen-main/Engen-main/rust-engine/**"
      - ".github/workflows/rust-engine.yml"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Engen-main/Engen-main/rust-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust unit and integration tests
        run: cargo test --all-targets
      - name: Python Phase 2 behavioral-reference tests
        working-directory: Engen-main/Engen-main
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s engine/engine/engine/tests -p 'test_transaction_*.py'
          python -m unittest discover -s engine/engine/engine/tests -p 'test_solana_validation.py'
          python -m unittest discover -s engine/engine/engine/tests -p 'test_rpc_policy.py'
          python -m unittest discover -s engine/engine/engine/tests -p 'test_signature_store.py'
          python -m unittest discover -s engine/engine/engine/tests -p 'test_wallet_monitor.py'
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
