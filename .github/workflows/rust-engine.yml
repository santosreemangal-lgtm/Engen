name: Rust Engine Checks

concurrency:
  group: rust-engine-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "Engen-main/Engen-main/rust-engine/**"
      - "Engen-main/Engen-main/engine/**"
      - "Engen-main/Engen-main/dashboard/**"
      - ".github/workflows/rust-engine.yml"
  push:
    branches:
      - "rewrite/rust-backend-20261109"
    paths:
      - "Engen-main/Engen-main/rust-engine/**"
      - "Engen-main/Engen-main/engine/**"
      - "Engen-main/Engen-main/dashboard/**"
      - ".github/workflows/rust-engine.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Engen-main/Engen-main/rust-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Produce formatted Rust source artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/rewrite/rust-backend-20261109'
        run: cargo fmt --all
      - name: Upload formatted Rust source
        if: github.event_name == 'push' && github.ref == 'refs/heads/rewrite/rust-backend-20261109'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-current-source
          path: |
            Engen-main/Engen-main/rust-engine/src/*.rs
            Engen-main/Engen-main/rust-engine/tests/**/*.rs
          if-no-files-found: error
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Commit canonical rustfmt normalization and dispatch verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/rewrite/rust-backend-20261109'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- Engen-main/Engen-main/rust-engine; then
            echo "Rust sources already match rustfmt."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- 'Engen-main/Engen-main/rust-engine/src/*.rs' 'Engen-main/Engen-main/rust-engine/tests/*.rs'
            git commit -m "chore(rust): apply canonical rustfmt normalization"
            git push origin "HEAD:rewrite/rust-backend-20261109"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/rust-engine.yml/dispatches \
              --data '{"ref":"rewrite/rust-backend-20261109"}'
          fi
      - name: Rust unit and integration tests
        run: cargo test --all-targets
      - name: Public Solana mainnet read-only RPC smoke test
        env:
          ENGEN_PUBLIC_RPC_INTEGRATION: "1"
        run: cargo test --test public_rpc_smoke -- --nocapture
      - name: Python Phase 2 behavioral-reference tests
        working-directory: Engen-main/Engen-main
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s engine/engine/engine/tests -p 'test_transaction_*.py'
          python -m unittest discover -s engine/engine/engine/tests -p 'test_solana_validation.py'
          python -m unittest discover -s engine/engine/engine/tests -p 'test_rpc_policy.py'
          python -m unittest discover -s engine/engine/engine/tests -p 'test_signature_store.py'
          python -m unittest discover -s engine/engine/engine/tests -p 'test_wallet_monitor.py'
      - name: Python Phase 8 P&L and ROI behavioral-reference tests
        working-directory: Engen-main/Engen-main
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s engine/engine/engine/tests -p 'test_phase8_pnl_simulation.py' -v
      - name: Dashboard backend and browser script syntax
        working-directory: Engen-main/Engen-main
        run: |
          python -m py_compile dashboard/server.py engine/pnl.py
          python - <<'PY'
          from pathlib import Path
          import re
          page = Path("dashboard/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", page, flags=re.DOTALL)
          if len(scripts) != 1:
              raise SystemExit(f"Expected exactly one inline dashboard script; found {len(scripts)}")
          Path("/tmp/engen-dashboard.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/engen-dashboard.js
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
