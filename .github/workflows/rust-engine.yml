name: Rust Engine Checks

concurrency:
  group: rust-engine-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "Engen-main/Engen-main/rust-engine/**"
      - "Engen-main/Engen-main/engine/**"
      - "Engen-main/Engen-main/dashboard/**"
      - ".github/workflows/rust-engine.yml"
      - "docs/RUST_ONLY_RUNTIME_MIGRATION.md"
      - "scripts/audit_rust_runtime_migration.sh"
      - "scripts/run_engen_rust_dashboard.sh"
  push:
    branches:
      - "rewrite/rust-backend-20261109"
      - "migration/rust-dashboard-runtime-20261113"
    paths:
      - "Engen-main/Engen-main/rust-engine/**"
      - "Engen-main/Engen-main/engine/**"
      - "Engen-main/Engen-main/dashboard/**"
      - ".github/workflows/rust-engine.yml"
      - "docs/RUST_ONLY_RUNTIME_MIGRATION.md"
      - "scripts/audit_rust_runtime_migration.sh"
      - "scripts/run_engen_rust_dashboard.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Engen-main/Engen-main/rust-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust unit and integration tests
        run: cargo test --all-targets
      - name: Public Solana mainnet read-only RPC smoke test
        env:
          ENGEN_PUBLIC_RPC_INTEGRATION: "1"
        run: cargo test --test public_rpc_smoke -- --nocapture
      - name: Python Phase 2 behavioral-reference tests
        working-directory: Engen-main/Engen-main
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s engine/engine/engine/tests -p 'test_transaction_*.py'
          python -m unittest discover -s engine/engine/engine/tests -p 'test_solana_validation.py'
          python -m unittest discover -s engine/engine/engine/tests -p 'test_rpc_policy.py'
          python -m unittest discover -s engine/engine/engine/tests -p 'test_signature_store.py'
          python -m unittest discover -s engine/engine/engine/tests -p 'test_wallet_monitor.py'
      - name: Python Phase 8 P&L and ROI behavioral-reference tests
        working-directory: Engen-main/Engen-main
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s engine/engine/engine/tests -p 'test_phase8_pnl_simulation.py' -v
      - name: Dashboard backend and browser script syntax
        working-directory: Engen-main/Engen-main
        run: |
          python -m py_compile dashboard/server.py engine/pnl.py
          python - <<'PY'
          from pathlib import Path
          import re
          page = Path("dashboard/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", page, flags=re.DOTALL)
          if len(scripts) != 1:
              raise SystemExit(f"Expected exactly one inline dashboard script; found {len(scripts)}")
          Path("/tmp/engen-dashboard.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/engen-dashboard.js
      - name: Rust-native dashboard launcher smoke test (no Python invocation)
        working-directory: .
        run: |
          bash -n scripts/run_engen_rust_dashboard.sh
          if grep -Eq '(^|[[:space:]])python(3)?([[:space:]]|$)' scripts/run_engen_rust_dashboard.sh; then
            echo "Rust dashboard launcher must not invoke Python."
            exit 1
          fi
          cargo run --manifest-path Engen-main/Engen-main/rust-engine/Cargo.toml -- --help | grep -F "engen-engine serve-dashboard"
          cargo run --manifest-path Engen-main/Engen-main/rust-engine/Cargo.toml -- check-config > /tmp/engen-rust-config.json
          grep -F '"live_trading_enabled": false' /tmp/engen-rust-config.json
          grep -F '"signing_available": false' /tmp/engen-rust-config.json
          cargo run --manifest-path Engen-main/Engen-main/rust-engine/Cargo.toml -- health-check > /tmp/engen-rust-health.json
          grep -F '"status": "ok"' /tmp/engen-rust-health.json
          grep -F '"emergency_stop_engaged": true' /tmp/engen-rust-health.json
      - name: Rust dashboard launcher process E2E (localhost only)
        working-directory: .
        run: |
          set -euo pipefail
          TEMP_DATA="$(mktemp -d)"
          export ENGEN_APP_ROOT="$GITHUB_WORKSPACE/Engen-main/Engen-main"
          export ENGEN_RUST_BINARY="$GITHUB_WORKSPACE/Engen-main/Engen-main/rust-engine/target/debug/engen-engine"
          export PROFILE_STORE_DB="$TEMP_DATA/profiles.db"
          export SIGNATURE_DB="$TEMP_DATA/signatures.db"
          export PAPER_SIMULATOR_DB="$TEMP_DATA/paper_simulator.db"
          export WALLETS_FILE="$TEMP_DATA/wallets.json"
          export MONITOR_STATE_FILE="$TEMP_DATA/monitoring_state.json"
          export PORT=18763
          bash scripts/run_engen_rust_dashboard.sh >"$TEMP_DATA/server.log" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            rm -rf "$TEMP_DATA"
          }
          trap cleanup EXIT
          READY=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:$PORT/" -o "$TEMP_DATA/index.html"; then
              READY=1
              break
            fi
            sleep 0.5
          done
          if [[ "$READY" != "1" ]]; then
            cat "$TEMP_DATA/server.log"
            exit 1
          fi
          grep -F "<html" "$TEMP_DATA/index.html"
          grep -F '<script src="/dashboard/pending_copy_ui.js"></script>' "$TEMP_DATA/index.html"
          curl --fail --silent "http://127.0.0.1:$PORT/dashboard/pending_copy_ui.js" > "$TEMP_DATA/pending_copy_ui.js"
          grep -F "EngenPendingCopy" "$TEMP_DATA/pending_copy_ui.js"
          curl --fail --silent "http://127.0.0.1:$PORT/api/wallets" > "$TEMP_DATA/wallets.json"
          grep -F '"wallets":[]' "$TEMP_DATA/wallets.json"
          curl --silent --show-error -D "$TEMP_DATA/headers.txt" -o /dev/null "http://127.0.0.1:$PORT/api/wallets"
          grep -iF "Content-Security-Policy:" "$TEMP_DATA/headers.txt"
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Audit Rust-only production runtime migration (report-only until cutover)
        working-directory: .
        run: bash scripts/audit_rust_runtime_migration.sh
