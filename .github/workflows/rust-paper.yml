name: rust-paper
on:
  push:
    paths:
      - "rust/**"
      - ".github/workflows/rust-paper.yml"
  pull_request:
    paths:
      - "rust/**"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --offline --manifest-path rust/engen_core/Cargo.toml || cargo test --manifest-path rust/engen_core/Cargo.toml
