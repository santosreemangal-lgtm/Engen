name: Engen Offline Mock Analysis Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: Engen-main/Engen-main/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f Engen-main/Engen-main/requirements.txt ]; then
            python -m pip install -r Engen-main/Engen-main/requirements.txt
          fi

      - name: Compile project Python files
        run: python -m compileall -q Engen-main/Engen-main

      - name: Run offline unit tests
        run: python -m unittest discover -s Engen-main/Engen-main/engine/engine/engine/tests -v

      - name: Run autonomous mock analysis check
        run: python main.py --mock-analysis-test
