name: Paper Copy Engine Verification

on:
  push:
    branches:
      - fix/paper-monitor-backlog-stale-refs-20261101
  pull_request:
    branches:
      - feature/paper-balance-dashboard-refresh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-paper-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile application and tests
        working-directory: Engen-main/Engen-main
        run: python -m compileall -q dashboard engine

      - name: Run complete offline unit and integration suite
        working-directory: Engen-main/Engen-main
        run: python -m unittest discover -s engine/engine/engine/tests -v
