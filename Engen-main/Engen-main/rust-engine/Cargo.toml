[package]
name = "engen-engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "Read-only Solana wallet monitoring and paper-simulation engine"

[lib]
name = "engen_engine"
path = "src/lib.rs"

[dependencies]
bigdecimal = { version = "0.4", features = ["serde"] }
bs58 = "0.5"
chrono = "0.4"
httpdate = "1"
num-traits = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
