[package]
name = "engen_core"
version = "0.1.0"
edition = "2021"
description = "Engen paper copy core — no signing, no broadcast"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[lib]
name = "engen_core"
path = "src/lib.rs"

[[bin]]
name = "engen_paper"
path = "src/main.rs"
